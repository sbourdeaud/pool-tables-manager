name: Backend Tests

permissions:
  contents: read

# CI owns the blocking PostgreSQL + coverage run. Keep this manual-only workflow
# for quick diagnostics without a database service, not duplicate push/PR tests.
on:
  workflow_dispatch:

jobs:
  test:
    name: Run Backend Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # Prisma 7 reads DATABASE_URL from prisma.config.ts; generation does not connect.
        run: npx prisma generate
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=json --coverageReporters=lcov --coverageReporters=text
        env:
          NODE_ENV: test

      - name: Upload test results
        if: ${{ always() && hashFiles('backend/coverage/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage to Codecov (optional)
        if: ${{ !cancelled() && vars.ENABLE_CODECOV == 'true' && hashFiles('backend/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          directory: backend/coverage
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true
