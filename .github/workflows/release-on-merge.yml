name: Release on merge to master

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  # Read-only planning for the selected main/master branch; never publishes.
  workflow_dispatch:

permissions:
  contents: read

# Queue all successful commits, not just the most recent pending run.
concurrency:
  group: release-on-merge
  queue: max

jobs:
  prepare:
    name: Prepare tag and draft after trusted CI
    # workflow_run is privileged. Reject PRs, forks and failed CI BEFORE checkout.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Determine or resume version at the exact tested commit
        id: version
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/release-version.mjs "$EXPECTED_COMMIT"

      - name: Create and push tag (or verify existing tag)
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.version.outputs.commit }}
          RESUME: ${{ steps.version.outputs.resume }}
        run: |
          set -euo pipefail
          if [[ "$RESUME" == 'true' ]]; then
            [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$EXPECTED_COMMIT" ]]
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$EXPECTED_COMMIT" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create or resume draft with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: node scripts/release-github.mjs prepare

  publish:
    name: Publish prepared release image
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      expected_commit: ${{ needs.prepare.outputs.commit }}
      update_latest: true

  finalize:
    name: Publish release only after image succeeds
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify tag still identifies the tested commit
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$EXPECTED_COMMIT" ]]

      - name: Finalize release and image notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: node scripts/release-github.mjs finalize

  dry-run:
    name: Read-only version preview
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Restrict preview to selected main/master branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_REF" == 'refs/heads/master' || "$SELECTED_REF" == 'refs/heads/main' ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Preview only (no tag, release or image writes)
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/release-version.mjs "$EXPECTED_COMMIT"
