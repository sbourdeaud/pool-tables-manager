name: Publish container image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and publish (e.g. v1.0)'
        required: true
      update_latest:
        description: 'Also move the :latest tag to this image'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read
  packages: write

# Serialize publication, including :latest, without canceling pending releases.
concurrency:
  group: publish-container-image
  queue: max

jobs:
  prepare:
    name: Resolve requested tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.tag.outputs.image }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Validate image tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'Requested git tag must also be a valid Docker tag.' >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      # Resolve once so both platforms build the same commit even if the tag moves.
      - name: Resolve commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.update_latest == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=publish-image-${{ matrix.arch }}
          cache-to: type=gha,scope=publish-image-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  merge:
    name: Publish multi-platform image
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: digests-amd64
          path: ${{ runner.temp }}/digests/amd64

      - uses: actions/download-artifact@v4
        with:
          name: digests-arm64
          path: ${{ runner.temp }}/digests/arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.update_latest == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}

      - name: Create and inspect manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=()
          for arch in amd64 arm64; do
            files=("$RUNNER_TEMP/digests/$arch/"*)
            if (( ${#files[@]} != 1 )); then
              echo "Expected one digest for $arch" >&2
              exit 1
            fi
            digest=${files[0]##*/}
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          (( ${#tags[@]} > 0 ))
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
