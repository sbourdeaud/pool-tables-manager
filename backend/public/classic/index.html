<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pool Tables Manager</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/favicon-180.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <link rel="stylesheet" href="/vendor/pico.min.css">
  <style>
    :root {
      --bg: #ffffff; --fg: #111827; --card: #f3f4f6;
      --surface: rgba(17, 24, 39, 0.04);
      --surface-strong: rgba(17, 24, 39, 0.09);
      --border: rgba(17, 24, 39, 0.16);
      --border-strong: rgba(17, 24, 39, 0.30);
      --input-bg: #ffffff;
      --shadow: 0 6px 18px rgba(2, 6, 23, 0.10);
    }
    [data-theme="dark"] {
      --bg: #0b1220; --fg: #e6eef6; --card: #0f1724;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-strong: rgba(255, 255, 255, 0.09);
      --border: rgba(255, 255, 255, 0.14);
      --border-strong: rgba(255, 255, 255, 0.30);
      --input-bg: #0b1220;
      --shadow: 0 6px 18px rgba(2, 6, 23, 0.45);
    }
    body { background: var(--bg); color: var(--fg); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial; margin: 0; }
    header { padding: 12px; display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--border); background: var(--surface); }
    main { padding: 20px; }
    .card { background: var(--card); padding:12px; border-radius:12px }
    button { padding:8px 12px; border-radius:8px; background:transparent; color:var(--fg); border:1px solid var(--border); transition: all 0.15s; cursor: pointer }
    button:hover { background:var(--surface-strong); border-color:var(--border-strong); transform: translateY(-1px) }
    button:active { transform: translateY(0) scale(0.97); background:var(--surface); box-shadow: inset 0 2px 4px rgba(0,0,0,0.3) }
    @keyframes clickPulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      50% { box-shadow: 0 0 0 4px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .click-feedback { animation: clickPulse 0.3s ease-out; }
    /* Inputs/selects/textareas get explicit theme colors so fields stay visible in both
       themes. Checkboxes and radios are excluded to keep native rendering. */
    select, input:not([type="checkbox"]):not([type="radio"]), textarea {
      padding:8px 12px; border-radius:8px; background:var(--input-bg); color:var(--fg);
      border:1px solid var(--border); font-family:inherit; font-size:14px; transition: all 0.15s;
    }
    select:hover, input:not([type="checkbox"]):not([type="radio"]):hover, textarea:hover { border-color:var(--border-strong) }
    select:focus, input:not([type="checkbox"]):not([type="radio"]):focus, textarea:focus { outline:none; border-color:#10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15) }
    /* Dropdown list items need an explicit background/color: otherwise options render as
       light inherited text on the browser's white popup (unreadable) in dark mode. */
    select option { background: var(--input-bg); color: var(--fg); }
    label { display:inline-flex; align-items:center; gap:8px; font-weight:500 }
    /* Date picker styling */
    input[type="date"]::-webkit-calendar-picker-indicator { 
      filter: invert(0); 
      cursor: pointer; 
      opacity: 0.7;
      padding: 4px;
      border-radius: 4px;
    }
    [data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator { 
      filter: invert(1); 
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover { 
      opacity: 1; 
      background: var(--surface-strong);
    }
    input[type="date"]::-webkit-datetime-edit { color: var(--fg); }
    input[type="date"]::-webkit-datetime-edit-fields-wrapper { color: var(--fg); }
    input[type="date"]::-webkit-datetime-edit-text { color: var(--fg); opacity: 0.6; }
    input[type="date"]::-webkit-datetime-edit-month-field { color: var(--fg); }
    input[type="date"]::-webkit-datetime-edit-day-field { color: var(--fg); }
    input[type="date"]::-webkit-datetime-edit-year-field { color: var(--fg); }
    /* Number input styling */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 0.6;
      cursor: pointer;
    }
    input[type="number"]::-webkit-inner-spin-button:hover,
    input[type="number"]::-webkit-outer-spin-button:hover {
      opacity: 1;
    }
    /* Layout */
    .type-card { padding:12px; border-radius:12px; background: var(--surface) }
    .type-header { display:flex; align-items:center; gap:12px; margin-bottom:12px }
    .type-title { font-weight:700; font-size:16px }
    .type-badge { padding:6px 10px; border-radius:999px; color:#fff; font-weight:700 }
    .tables-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap:16px }
    .table-tile { position:relative; border-radius:14px; padding:16px; background: var(--surface); border:1px solid var(--border); box-shadow: var(--shadow); display:flex; flex-direction:column; gap:12px }
    .table-top { display:flex; justify-content:space-between; align-items:center }
    .table-num { font-weight:800; font-size:18px }
    .table-status { font-size:12px; padding:6px 8px; border-radius:8px; background:var(--surface-strong); color:var(--fg) }
    .table-maintenance-warning { font-size:13px; font-weight:700; padding:8px 10px; border-radius:8px; background:rgba(245,158,11,0.18); color:#f59e0b; border:1px solid rgba(245,158,11,0.4) }
    .player-row { display:flex; gap:8px; align-items:center }
    .tab-info { display:flex; gap:8px; align-items:center; font-size:14px }
    .table-qr-row { display:flex; gap:10px; align-items:center }
    .table-qr-thumb { width:64px; height:64px; padding:4px; background:#fff; border-radius:8px; cursor:pointer; flex-shrink:0; transition: transform 0.12s; box-shadow: 0 2px 6px rgba(0,0,0,0.2) }
    .table-qr-thumb:hover { transform:scale(1.06) }
    .table-qr-thumb svg { width:100%; height:100%; display:block }
    .table-qr-caption { font-size:12px; opacity:0.75; line-height:1.3 }
    #qrModalContent svg { width:260px; height:260px; background:#fff; padding:8px; border-radius:8px }
    #qrModalContent .qr-url { font-size:12px; opacity:0.8; word-break:break-all; max-width:300px }
    .icon-btn { width:48px; height:48px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.9); color:#000; border:1px solid rgba(0,0,0,0.18); cursor:pointer; font-size:16px; flex-shrink:0; transition: all 0.12s }
    .icon-btn:hover { background:rgba(255,255,255,1); transform:scale(1.08); box-shadow: 0 2px 8px rgba(0,0,0,0.15) }
    .icon-btn:active { transform:scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2) }
    [data-theme="dark"] .icon-btn { background:rgba(0,0,0,0.6); color:#fff; border:1px solid rgba(255,255,255,0.15) }
    [data-theme="dark"] .icon-btn:hover { background:rgba(0,0,0,0.8); box-shadow: 0 2px 8px rgba(255,255,255,0.1) }
    .admin-tile { cursor:pointer; transition: transform 0.15s, box-shadow 0.15s }
    .admin-tile:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,0.3) }
    .admin-tile:active { transform:translateY(0) scale(0.98); box-shadow:0 2px 8px rgba(0,0,0,0.2), inset 0 2px 4px rgba(0,0,0,0.2) }
    .tile-actions { display:flex; gap:8px; padding-top:8px; border-top:1px solid var(--border); margin-top:auto; flex-wrap:wrap }
    .tile-action { height:36px; padding:0 14px; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:6px; background:rgba(255,255,255,0.9); color:#000; border:1px solid rgba(0,0,0,0.18); cursor:pointer; font-size:14px; flex:1; min-width:80px; transition: all 0.12s }
    .tile-action:hover { background:rgba(255,255,255,1); border-color:rgba(0,0,0,0.2); box-shadow: 0 2px 8px rgba(0,0,0,0.1) }
    .tile-action:active { transform:scale(0.96); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2) }
    [data-theme="dark"] .tile-action { background:rgba(0,0,0,0.5); color:#fff; border:1px solid rgba(255,255,255,0.15) }
    [data-theme="dark"] .tile-action:hover { background:rgba(0,0,0,0.7); border-color:rgba(255,255,255,0.25); box-shadow: 0 2px 8px rgba(255,255,255,0.1) }
    .start-btn { width:100%; height:40px; border-radius:8px; background:linear-gradient(135deg, #10b981, #059669); color:#fff; border:none; cursor:pointer; font-weight:600; font-size:15px; margin-top:8px }
    .start-btn:hover { background:linear-gradient(135deg, #059669, #047857); transform:translateY(-1px); box-shadow:0 4px 12px rgba(16,185,129,0.4) }
    /* Modal */
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:50 }
    .modal { background:var(--card); color:var(--fg); padding:16px; border-radius:12px; width:520px; max-width:95%; box-shadow:0 8px 40px rgba(2,6,23,0.6); }
    .modal header { font-weight:700; margin-bottom:8px; font-size:18px }
    .modal .drinks-list { max-height:360px; overflow:auto; display:flex; flex-direction:column; gap:8px }
    .modal.show { display:block }
    .table-select-item { padding:12px; border-radius:8px; background:var(--surface); border:1px solid var(--border); cursor:pointer; transition:all 0.15s }
    .table-select-item:hover { background:var(--surface-strong); border-color:var(--border-strong); transform:translateY(-1px) }
    .checkout-summary { padding:12px; border-radius:8px; background:var(--surface); margin:12px 0 }
    .checkout-option { padding:10px; border-radius:6px; background:var(--surface); margin:8px 0; cursor:pointer; border:2px solid var(--border) }
    .checkout-option:hover { background:var(--surface-strong); border-color:rgba(16,185,129,0.5) }
    /* Header logo and theme button */
    .app-logo { width:64px; height:64px; margin-right:8px; transition: transform 0.5s ease-in-out; cursor: pointer }
    .app-logo:hover { transform: rotate(360deg) scale(1.1) }
    [data-theme="dark"] .app-logo circle:first-of-type { fill: url(#ballShadingDark) }
    [data-theme="dark"] .app-logo defs { display: block }
    @keyframes ballSpin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    #themeBtn { width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer }
    #themeBtn:hover { background:var(--surface-strong); transform:scale(1.08) }

    /* ===== Pico CSS reconciliation (pico.min.css loads before this block) =====
       Keep the app's existing look: pin heading sizes to the previous defaults,
       restore main padding, and tint Pico's primary/focus color to the app green. */
    body > main { padding: 20px; }
    h1 { font-size: 2rem }
    h2 { font-size: 1.5rem }
    h3 { font-size: 1.17rem }
    h4 { font-size: 1rem }
    :root {
      --pico-border-radius: 8px;
    }
    /* Must match Pico's `:root:not([data-theme=dark])` specificity or it wins the cascade */
    :root:not([data-theme="dark"]) {
      --pico-primary: #10b981;
      --pico-primary-background: #10b981;
      --pico-primary-border: #059669;
      --pico-primary-hover: #047857;
      --pico-primary-hover-background: #059669;
      --pico-primary-focus: rgba(16, 185, 129, 0.25);
      --pico-primary-inverse: #ffffff;
    }
    [data-theme="dark"] {
      --pico-primary: #10b981;
      --pico-primary-background: #059669;
      --pico-primary-border: #047857;
      --pico-primary-hover: #34d399;
      --pico-primary-hover-background: #10b981;
      --pico-primary-focus: rgba(16, 185, 129, 0.35);
    }

    /* ===== Settings page ===== */
    .settings-wrap { max-width: 1300px; margin: 0 auto; }
    .page-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px }
    .page-head h2 { margin: 6px 0 0 }
    .back-link { align-self: flex-start; font-size: 14px }
    .settings-grid { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start }
    @media (min-width: 1100px) {
      .settings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) }
      .span-all { grid-column: 1 / -1 }
      .split { grid-template-columns: 1fr 1fr }
    }
    article.settings-card { margin: 0; padding: 20px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); box-shadow: var(--shadow) }
    article.settings-card.danger-card { border-color: rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.07) }
    .card-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px }
    .card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(16, 185, 129, 0.13); color: #059669; flex-shrink: 0 }
    [data-theme="dark"] .card-icon { background: rgba(16, 185, 129, 0.15); color: #34d399 }
    .danger-card .card-icon { background: rgba(239, 68, 68, 0.14); color: #dc2626 }
    .card-title { font-size: 16px; font-weight: 700; margin: 0 }
    .card-desc { font-size: 13px; opacity: 0.7; margin: 3px 0 0; line-height: 1.45 }
    .card-divider { height: 0; border: 0; border-top: 1px solid var(--border); margin: 16px 0; background: none }
    .card-subhead { font-size: 14px; font-weight: 700; margin: 0 0 12px }
    .fields-grid { display: grid; gap: 14px 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) }
    .field { display: flex; flex-direction: column; gap: 6px; margin: 0; align-items: stretch }
    .field-wide { grid-column: 1 / -1 }
    .field-label { display: flex; align-items: center; font-size: 13px; font-weight: 600; opacity: 0.85 }
    .field-help { font-size: 12px; opacity: 0.65; line-height: 1.5; font-weight: 400 }
    .save-ind { font-size: 11px; font-weight: 700; color: #059669; margin-left: 8px; opacity: 0; transition: opacity 0.2s }
    .save-ind.show { opacity: 1 }
    [data-theme="dark"] .save-ind { color: #34d399 }
    .split { display: grid; gap: 20px; grid-template-columns: 1fr }
    .switch-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; margin: 0 }
    .switch-text { display: flex; flex-direction: column; gap: 2px }
    .switch-title-row { display: flex; align-items: center; gap: 8px }
    .switch-text strong { font-size: 14px; font-weight: 600 }
    .switch-text small { font-size: 12px; opacity: 0.65; line-height: 1.4 }
    .badge-device { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--surface-strong); border: 1px solid var(--border); opacity: 0.85 }
    .card-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px }
    .action-help { font-size: 12px; opacity: 0.65; margin-top: 8px; line-height: 1.5 }
    .btn-primary { background: #10b981; color: #fff; border: 1px solid #059669; font-weight: 600 }
    .btn-primary:hover { background: #059669; border-color: #047857 }
    .btn-danger { background: #dc2626; color: #fff; border: 1px solid #b91c1c; font-weight: 600 }
    .btn-danger:hover { background: #b91c1c; border-color: #991b1b }
    .btn-outline-danger { color: #dc2626; border-color: rgba(220, 38, 38, 0.55); background: transparent }
    .btn-outline-danger:hover { background: rgba(220, 38, 38, 0.1); border-color: #dc2626 }
    .settings-card input, .settings-card select, .settings-card textarea { margin: 0 }

    /* Auth modal */
    .auth-fields { display: flex; flex-direction: column; gap: 12px; margin-top: 12px }
    .modal .field { margin: 0 }
    .modal .field input { margin: 0 }
    .auth-error { color: #dc2626; background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.35); padding: 8px 10px; border-radius: 8px; font-size: 13px; margin-top: 10px }
    [data-theme="dark"] .auth-error { color: #f87171; background: rgba(220, 38, 38, 0.14) }

    /* Toasts (save feedback) */
    #toastStack { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 200; max-width: 360px }
    .toast { padding: 10px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 14px; animation: toastIn 0.18s ease-out; transition: opacity 0.25s, transform 0.25s }
    .toast.ok { border-color: rgba(16, 185, 129, 0.55) }
    .toast.error { border-color: rgba(239, 68, 68, 0.6); background: rgba(239, 68, 68, 0.12) }
    .toast.hide { opacity: 0; transform: translateY(8px) }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { .toast { animation: none } .toast { transition: none } }
  </style>
</head>
<body>
  <header>
    <a href="#" id="logoLink" style="display:inline-flex; align-items:center; text-decoration:none">
      <svg class="app-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="ballShading" cx="35%" cy="35%">
            <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
          </radialGradient>
        </defs>
        <circle cx="50" cy="50" r="48" fill="url(#ballShading)" stroke="#000" stroke-width="1"/>
        <circle cx="50" cy="30" rx="20" ry="18" r="18" fill="white"/>
        <text x="50" y="39" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="black">8</text>
      </svg>
    </a>
    <h1 id="title">Pool Hall</h1>
    <nav style="margin-left:16px; display:flex; gap:8px; align-items:center">
      <button id="navDashboard">Dashboard</button>
      <button id="navAdmin">Admin</button>
      <button id="navStatus">Public Status</button>
      <button id="navApp" title="New admin UI (preview)">New Admin UI</button>
    </nav>
    <div style="margin-left:auto; display:flex; gap:8px; align-items:center">
      <button id="themeBtn" title="Toggle Theme">🌙</button>
    </div>
  </header>
  <main>
    <div id="app"></div>
  </main>
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal card" id="addDrinkModal" role="dialog" aria-modal="true" style="display:none">
      <header>Add Drink</header>
      <div class="drinks-list" id="modalDrinksList"></div>
      <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end">
        <button id="modalClose">Close</button>
      </div>
    </div>
    <div class="modal card" id="transferModal" role="dialog" aria-modal="true" style="display:none">
      <header>Transfer to Table</header>
      <div id="transferTableList" style="max-height:360px; overflow:auto; display:flex; flex-direction:column; gap:8px; margin:12px 0"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end">
        <button id="transferClose">Cancel</button>
      </div>
    </div>
    <div class="modal card" id="checkoutModal" role="dialog" aria-modal="true" style="display:none">
      <header>Checkout</header>
      <div id="checkoutContent"></div>
      <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end">
        <button id="checkoutClose">Cancel</button>
      </div>
    </div>
    <div class="modal card" id="startSessionModal" role="dialog" aria-modal="true" style="display:none">
      <header>Start Session</header>
      <div id="startSessionContent" style="padding:12px 0">
        <div style="margin-bottom:16px">
          <div style="font-weight:600; margin-bottom:8px">👥 Subscribers (free table time)</div>
          <div style="display:flex; gap:8px; align-items:center">
            <button id="subMinus" class="icon-btn" style="width:40px; height:40px; font-size:20px">−</button>
            <div id="subCount" style="font-size:24px; font-weight:700; min-width:40px; text-align:center">0</div>
            <button id="subPlus" class="icon-btn" style="width:40px; height:40px; font-size:20px">+</button>
          </div>
        </div>
        <div>
          <div style="font-weight:600; margin-bottom:8px">👤 Non-Subscribers</div>
          <div style="display:flex; gap:8px; align-items:center">
            <button id="nonsubMinus" class="icon-btn" style="width:40px; height:40px; font-size:20px">−</button>
            <div id="nonsubCount" style="font-size:24px; font-weight:700; min-width:40px; text-align:center">1</div>
            <button id="nonsubPlus" class="icon-btn" style="width:40px; height:40px; font-size:20px">+</button>
          </div>
        </div>
      </div>
      <div style="display:flex; gap:8px; justify-content:flex-end">
        <button id="startSessionCancel">Cancel</button>
        <button id="startSessionConfirm" style="background:#10b981; color:#fff; font-weight:600">Start Session</button>
      </div>
    </div>
    <div class="modal card" id="settlementModal" role="dialog" aria-modal="true" style="display:none">
      <header>Player Settlement</header>
      <div id="settlementContent"></div>
      <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end">
        <button id="settlementClose">Cancel</button>
      </div>
    </div>
    <div class="modal card" id="qrModal" role="dialog" aria-modal="true" style="display:none; width:360px; text-align:center">
      <header id="qrModalHeader">Scan to View Tab</header>
      <div id="qrModalContent" style="display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px 0"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end">
        <button id="qrClose">Close</button>
      </div>
    </div>
    <div class="modal card" id="authModal" role="dialog" aria-modal="true" style="display:none">
      <header id="authModalHeader">Login</header>
      <div id="authModalBody" style="padding:8px 0">
        <div id="authMessage" style="margin-bottom:4px; opacity:0.9">Please authenticate to access admin features.</div>
        <div id="authError" class="auth-error" role="alert" style="display:none"></div>
        <div id="authSetupFields" class="auth-fields" style="display:none">
          <label class="field"><span class="field-label">New admin password</span><input id="authNewPassword" type="password" autocomplete="new-password" /></label>
          <label class="field"><span class="field-label">Confirm password</span><input id="authConfirmPassword" type="password" autocomplete="new-password" /></label>
        </div>
        <div id="authLoginFields" class="auth-fields" style="display:none">
          <label class="field"><span class="field-label">Admin password</span><input id="authPassword" type="password" autocomplete="current-password" /></label>
        </div>
      </div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px">
        <button id="authCancel">Cancel</button>
        <button id="authSubmit" style="background:#10b981; color:#fff; font-weight:600">Submit</button>
      </div>
    </div>
  </div>
  <script src="/main.js"></script>
</body>
</html>
